# Cameo amdgpu kernel-module tuning.
#
# ⚠️ STARTING POINTS — confirm on real hardware in Phase 1. Wrong values here can
# prevent the GPU from initializing, so every non-trivial option is commented out
# by default and enabled deliberately per validated combination.

# Enlarge the GTT (system-memory) aperture so the GPU can address more host RAM
# for MoE-expert / layer offload. Units are MiB. 0/unset = driver auto. Raise
# this if offloaded inference is starved for host-visible memory.
# options amdgpu gttsize=16384

# Expose all power features (fan / clock / voltage control) for tuning and for
# rocm-smi to report/adjust. Disabled by default like every option here — full
# ppfeaturemask lets any root-capable context push voltage/clock overrides, so
# enable it deliberately per validated card rather than shipping it on.
# options amdgpu ppfeaturemask=0xffffffff

# For older cards that need it, uncomment to force display core / SI/CIK support:
# options amdgpu si_support=1
# options amdgpu cik_support=1
