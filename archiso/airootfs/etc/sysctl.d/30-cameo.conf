# Cameo host-memory tuning for GPU offload buffers.
# Values are conservative defaults; calibrate against Phase 1 measurements.

# Hugepages backing pinned host<->GPU transfer buffers. 0 = disabled by default;
# set to the count that covers your offload working set once measured (each is
# 2 MiB by default, so e.g. 4096 reserves ~8 GiB). NUMA placement matters: pin
# on the node nearest the GPU's PCIe root.
vm.nr_hugepages = 0

# Keep pinned offload buffers resident under memory pressure instead of swapping.
vm.swappiness = 10
