# Cameo host-memory tuning for GPU offload buffers.
#
# This file deliberately sets nothing. It used to ship two settings that were
# both no-ops on the machine they were aimed at:
#
#   vm.nr_hugepages = 0   reserving zero hugepages is what the kernel already
#                         does, so the line only looked like tuning
#   vm.swappiness = 10    tells the kernel how eagerly to swap, on a live image
#                         that has no swap device at all
#
# Values that do nothing are worse than absent ones: they read as "this has been
# tuned". The knobs are documented here so they can be set deliberately, once
# there is a measurement to set them from.
#
# Hugepages backing pinned host<->GPU transfer buffers. Each is 2 MiB by
# default, so 4096 reserves ~8 GiB, taken out of general-purpose RAM
# immediately and permanently. Size it to a measured offload working set, and
# note that NUMA placement matters: reserve on the node nearest the GPU's PCIe
# root.
#   vm.nr_hugepages = 4096
#
# Swap behaviour, which only means anything once a swap device exists. On a box
# that offloads model weights to host RAM, a low value keeps those pages
# resident instead of paging them back out under pressure.
#   vm.swappiness = 10
