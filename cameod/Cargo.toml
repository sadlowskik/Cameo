[package]
name = "cameo-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "cameod: the Cameo control-plane daemon — a browser-administered console for AMD-GPU inference hosting."

[[bin]]
name = "cameod"
path = "src/main.rs"

[dependencies]
cameo-gpu-detect.workspace = true
cameo-config.workspace = true
cameo-placement.workspace = true
cameo-models.workspace = true
cameo-api.workspace = true
cameo-net-strategy.workspace = true
serde = { workspace = true }
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
getrandom.workspace = true
sha2.workspace = true
fs2 = "0.4"
ctrlc = { version = "3.5.2", features = ["termination"] }
# HTTPS for the console listener (self-signed, minted on first start). Pure
# Rust TLS; the HTTP framing above it stays the hand-written server.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1.11", features = ["std"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
