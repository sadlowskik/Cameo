name: ISO

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Cameo edition to build"
        type: choice
        options:
          - lite
          - full
        default: lite
  push:
    tags:
      - "v*"

# The build runs inside a long-lived privileged Arch container driven by
# `docker exec`, one named step per command. That is deliberate: workflow logs
# require authentication to read, but per-step conclusions are public API, so
# granular step names make a failure diagnosable from outside.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Runner diagnostics
        run: |
          docker version
          df -h /
          free -h

      # mkarchiso unpacks the package set twice (airootfs + squashfs work copy).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Anonymous Docker Hub pulls from shared runner IPs get rate-limited, so
      # retry rather than failing the whole build on a 429.
      - name: Pull Arch image
        run: |
          for i in 1 2 3 4 5; do
            if docker pull archlinux:base-devel; then
              exit 0
            fi
            echo "pull attempt $i failed; retrying in 20s"
            sleep 20
          done
          echo "could not pull archlinux:base-devel after 5 attempts"
          exit 1

      - name: Start container
        run: |
          docker run -d --privileged --name arch \
            -v "$PWD:/repo" -w /repo \
            archlinux:base-devel sleep infinity
          docker ps

      - name: Refresh keyring
        run: docker exec arch bash -euo pipefail -c "pacman -Sy --noconfirm --needed archlinux-keyring"

      # librsvg supplies rsvg-convert, which renders the boot splash from SVG.
      - name: Install archiso and rust
        run: docker exec arch bash -euo pipefail -c "pacman -Syu --noconfirm --needed archiso rust librsvg"

      - name: Verify toolchain
        run: docker exec arch bash -euo pipefail -c "mkarchiso -h >/dev/null && cargo --version && rustc --version"

      - name: Build cameo CLI
        run: docker exec arch bash -euo pipefail -c "cargo build --release -p cameo-cli"

      # pacman 7 runs downloads under an unprivileged DownloadUser confined by
      # landlock. That sandbox cannot be set up inside a container and aborts
      # pacstrap, which is what mkarchiso uses to populate the airootfs.
      - name: Disable pacman sandbox for the nested pacstrap
        run: |
          docker exec arch bash -euo pipefail -c \
            "grep -q '^DisableSandbox' /usr/share/archiso/configs/releng/pacman.conf \
             || sed -i '/^\[options\]/a DisableSandbox' /usr/share/archiso/configs/releng/pacman.conf"
          docker exec arch bash -euo pipefail -c \
            "sed -n '/\[options\]/,/^$/p' /usr/share/archiso/configs/releng/pacman.conf"

      # tee on the host, not in the container: this also captures docker exec's
      # own failures, which a container-side redirect would miss entirely.
      - name: Build ISO
        env:
          EDITION: ${{ github.event.inputs.edition || 'lite' }}
        run: |
          set -o pipefail
          docker exec -e CAMEO_EDITION="$EDITION" arch \
            bash -euo pipefail -c "bash ./scripts/build-iso.sh" 2>&1 | tee build.log

      - name: Disk after build
        if: always()
        run: df -h /

      # Boot-screen text is otherwise only verifiable by booting the ISO, so
      # assert it against the staged profile instead.
      - name: Verify boot menu branding
        run: |
          echo "--- branded titles ---"
          grep -rhE 'MENU LABEL|^title' build/profile/syslinux build/profile/efiboot 2>/dev/null | sort -u
          echo "--- checking for leftovers ---"
          if grep -rn "Arch Linux" build/profile/syslinux build/profile/efiboot 2>/dev/null; then
            echo "FAIL: unbranded 'Arch Linux' titles remain"
            exit 1
          fi
          echo "OK: no unbranded titles remain"

      - name: Verify boot splash was rendered
        run: |
          ls -l build/profile/syslinux/splash.png
          file build/profile/syslinux/splash.png
          file build/profile/syslinux/splash.png | grep -q "640 x 480" \
            || { echo "FAIL: splash is not 640x480"; exit 1; }
          echo "OK: Cameo splash rendered at 640x480"

      - name: "DIAG log size and tail"
        if: always()
        run: |
          ls -l build.log || echo "NO build.log ON DISK"
          wc -c build.log || true
          echo "--- tail ---"
          tail -n 100 build.log || true

      # Workflow logs need authentication to read. Publishing the captured log
      # to a throwaway branch makes it fetchable over raw.githubusercontent,
      # which is what allows this failure to be diagnosed from outside CI.
      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          rm -rf /tmp/logpub && mkdir -p /tmp/logpub
          cp build.log /tmp/logpub/build.log 2>/dev/null || echo "no build.log produced" > /tmp/logpub/build.log
          cd /tmp/logpub
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.log
          git commit -qm "build log for run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Collect output
        run: |
          sudo chown -R "$(id -u):$(id -g)" archiso/out
          cd archiso/out
          sha256sum ./*.iso > SHA256SUMS
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: cameo-iso-${{ github.event.inputs.edition || 'lite' }}
          path: |
            archiso/out/*.iso
            archiso/out/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
