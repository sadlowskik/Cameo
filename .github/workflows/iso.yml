name: ISO

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Cameo edition to build"
        type: choice
        options:
          - lite
          - full
        default: lite
  push:
    tags:
      - "v*"

# The build runs inside a long-lived privileged Arch container driven by
# `docker exec`, one named step per command. That is deliberate: workflow logs
# require authentication to read, but per-step conclusions are public API, so
# granular step names make a failure diagnosable from outside.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Runner diagnostics
        run: |
          docker version
          df -h /
          free -h

      # mkarchiso unpacks the package set twice (airootfs + squashfs work copy).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Anonymous Docker Hub pulls from shared runner IPs get rate-limited, so
      # retry rather than failing the whole build on a 429.
      - name: Pull Arch image
        run: |
          for i in 1 2 3 4 5; do
            if docker pull archlinux:base-devel; then
              exit 0
            fi
            echo "pull attempt $i failed; retrying in 20s"
            sleep 20
          done
          echo "could not pull archlinux:base-devel after 5 attempts"
          exit 1

      - name: Start container
        run: |
          docker run -d --privileged --name arch \
            -v "$PWD:/repo" -w /repo \
            archlinux:base-devel sleep infinity
          docker ps

      - name: Refresh keyring
        run: docker exec arch bash -euo pipefail -c "pacman -Sy --noconfirm --needed archlinux-keyring"

      - name: Install archiso and rust
        run: docker exec arch bash -euo pipefail -c "pacman -Syu --noconfirm --needed archiso rust"

      - name: Verify toolchain
        run: docker exec arch bash -euo pipefail -c "mkarchiso -h >/dev/null && cargo --version && rustc --version"

      - name: Build cameo CLI
        run: docker exec arch bash -euo pipefail -c "cargo build --release -p cameo-cli"

      # pacman 7 runs downloads under an unprivileged DownloadUser confined by
      # landlock. That sandbox cannot be set up inside a container and aborts
      # pacstrap, which is what mkarchiso uses to populate the airootfs.
      - name: Disable pacman sandbox for the nested pacstrap
        run: |
          docker exec arch bash -euo pipefail -c \
            "grep -q '^DisableSandbox' /usr/share/archiso/configs/releng/pacman.conf \
             || sed -i '/^\[options\]/a DisableSandbox' /usr/share/archiso/configs/releng/pacman.conf"
          docker exec arch bash -euo pipefail -c \
            "sed -n '/\[options\]/,/^$/p' /usr/share/archiso/configs/releng/pacman.conf"

      - name: Build ISO
        env:
          EDITION: ${{ github.event.inputs.edition || 'lite' }}
        run: docker exec -e CAMEO_EDITION="$EDITION" arch bash -euo pipefail -c "bash ./scripts/build-iso.sh 2>&1 | tee /repo/build.log"

      - name: Disk after build
        if: always()
        run: df -h /

      # Log text is only readable with authentication, but step conclusions are
      # public. Each probe below turns "is this string in the log?" into a step
      # result, so a failure is diagnosable without reading the log.
      - name: "DIAG tail of build log"
        if: failure()
        run: tail -n 80 build.log || echo "no build.log produced"

      - name: "DIAG probe pacman sandbox or landlock error"
        if: failure()
        run: grep -qiE 'sandbox|landlock|DownloadUser' build.log

      - name: "DIAG probe no space left on device"
        if: failure()
        run: grep -qiE 'no space left|disk full' build.log

      - name: "DIAG probe mount or loop device failure"
        if: failure()
        run: grep -qiE 'mount:|loop device|failed to mount|Operation not permitted' build.log

      - name: "DIAG probe package target not found"
        if: failure()
        run: grep -qiE 'target not found|could not find all required packages' build.log

      - name: "DIAG probe permission denied"
        if: failure()
        run: grep -qiE 'permission denied|operation not supported' build.log

      - name: "DIAG probe squashfs or compression failure"
        if: failure()
        run: grep -qiE 'mksquashfs|squashfs' build.log

      - name: "DIAG probe missing releng or profile file"
        if: failure()
        run: grep -qiE 'not found at|No such file or directory' build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Collect output
        run: |
          sudo chown -R "$(id -u):$(id -g)" archiso/out
          cd archiso/out
          sha256sum ./*.iso > SHA256SUMS
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: cameo-iso-${{ github.event.inputs.edition || 'lite' }}
          path: |
            archiso/out/*.iso
            archiso/out/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
