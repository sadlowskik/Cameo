name: ISO

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Cameo edition to build"
        type: choice
        options:
          - lite
          - full
        default: lite
  push:
    tags:
      - "v*"

# The build runs inside a long-lived privileged Arch container driven by
# `docker exec`, one named step per command. That is deliberate: workflow logs
# require authentication to read, but per-step conclusions are public API, so
# granular step names make a failure diagnosable from outside.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Runner diagnostics
        run: |
          docker version
          df -h /
          free -h

      # mkarchiso unpacks the package set twice (airootfs + squashfs work copy).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Anonymous Docker Hub pulls from shared runner IPs get rate-limited, so
      # retry rather than failing the whole build on a 429.
      - name: Pull Arch image
        run: |
          for i in 1 2 3 4 5; do
            if docker pull archlinux:base-devel; then
              exit 0
            fi
            echo "pull attempt $i failed; retrying in 20s"
            sleep 20
          done
          echo "could not pull archlinux:base-devel after 5 attempts"
          exit 1

      - name: Start container
        run: |
          docker run -d --privileged --name arch \
            -v "$PWD:/repo" -w /repo \
            archlinux:base-devel sleep infinity
          docker ps

      # The image ships a mirrorlist of pkgbuild CDNs, which can serve a package
      # database newer than the package pool behind it. pacstrap then 404s on a
      # version the database advertises but no mirror actually has, which is not
      # transient and does not resolve by retrying.
      - name: Pin mirrors that publish db and packages together
        run: |
          # kernel.org demoted: it has stalled mid-transfer on three separate
          # runs with "Operation too slow", which pacman treats as fatal for
          # the whole transaction.
          cat > /tmp/mirrorlist <<'MIRRORS'
          Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
          Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
          Server = https://mirror.leaseweb.net/archlinux/$repo/os/$arch
          Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch
          MIRRORS
          docker cp /tmp/mirrorlist arch:/etc/pacman.d/mirrorlist
          docker exec arch bash -euo pipefail -c "cat /etc/pacman.d/mirrorlist && pacman -Syy --noconfirm"

      - name: Refresh keyring
        run: docker exec arch bash -euo pipefail -c "pacman -Sy --noconfirm --needed archlinux-keyring"

      # librsvg supplies rsvg-convert, which renders the boot splash from SVG.
      - name: Install archiso and rust
        run: docker exec arch bash -euo pipefail -c "pacman -Syu --noconfirm --needed archiso rust librsvg"

      - name: Verify toolchain
        run: docker exec arch bash -euo pipefail -c "mkarchiso -h >/dev/null && cargo --version && rustc --version"

      - name: Build cameo CLI + cameod
        run: docker exec arch bash -euo pipefail -c "CARGO_TARGET_DIR=/repo/build/cargo-target cargo build --release -p cameo-cli -p cameo-daemon"

      # pacman 7 runs downloads under an unprivileged DownloadUser confined by
      # landlock. That sandbox cannot be set up inside a container and aborts
      # pacstrap, which is what mkarchiso uses to populate the airootfs.
      - name: Disable pacman sandbox for the nested pacstrap
        run: |
          docker exec arch bash -euo pipefail -c \
            "grep -q '^DisableSandbox' /usr/share/archiso/configs/releng/pacman.conf \
             || sed -i '/^\[options\]/a DisableSandbox' /usr/share/archiso/configs/releng/pacman.conf"
          docker exec arch bash -euo pipefail -c \
            "sed -n '/\[options\]/,/^$/p' /usr/share/archiso/configs/releng/pacman.conf"

      # tee on the host, not in the container: this also captures docker exec's
      # own failures, which a container-side redirect would miss entirely.
      - name: Build ISO
        env:
          EDITION: ${{ github.event.inputs.edition || 'lite' }}
        run: |
          set -o pipefail
          # Arch mirrors have failed transiently on three runs -- once as a
          # database/pool skew 404, twice as a mid-transfer stall. pacman treats
          # either as fatal for the entire transaction, so a whole ISO build is
          # lost to one slow file. Retry rather than burning a manual re-run.
          for attempt in 1 2 3; do
            echo "=== build attempt $attempt ===" | tee -a build.log
            if docker exec -e CAMEO_EDITION="$EDITION" arch \
                 bash -euo pipefail -c "rm -rf /repo/build/tmp; bash ./scripts/build-iso.sh" 2>&1 | tee -a build.log; then
              exit 0
            fi
            echo "attempt $attempt failed" | tee -a build.log
            sleep 30
          done
          echo "all three build attempts failed" | tee -a build.log
          exit 1

      - name: Disk after build
        if: always()
        run: df -h /

      # Boot-screen text is otherwise only verifiable by booting the ISO, so
      # assert it against the staged profile instead.
      - name: Verify boot menu branding
        run: |
          echo "--- branded titles ---"
          grep -rhE 'MENU LABEL|^title' build/profile/syslinux build/profile/efiboot 2>/dev/null | sort -u
          echo "--- checking for leftovers ---"
          if grep -rn "Arch Linux" build/profile/syslinux build/profile/efiboot 2>/dev/null; then
            echo "FAIL: unbranded 'Arch Linux' titles remain"
            exit 1
          fi
          echo "OK: no unbranded titles remain"

      # Assert against the real built root filesystem, not the profile. These
      # are the properties whose absence is only visible by booting, and each
      # one here has already cost a burn-and-boot cycle to discover.
      - name: Verify the live environment is usable
        if: always()
        run: |
          # Mirror everything to build.log. Workflow logs need authentication
          # to read, so a check that fails only into the workflow log reports
          # that something is wrong without reporting what.
          exec > >(tee -a build.log) 2>&1
          A=$(sudo find build/tmp -maxdepth 3 -type d -name airootfs | head -1)
          echo "airootfs: $A"
          test -n "$A" || { echo "FAIL: no built airootfs found"; exit 1; }

          echo "--- root account ---"
          sudo grep '^root:' "$A/etc/shadow"
          # Passwordless, not merely unlocked. `--autologin` bypasses auth, but
          # the manual-login fallback (serial console, non-tty1 VT, a future
          # regression) needs an empty password or it is a lockout with no
          # recovery on a read-only live image. build-iso.sh forces this.
          if ! sudo grep -qE '^root::' "$A/etc/shadow"; then
            echo "FAIL: root is not passwordless; a fallback console login could lock out"
            sudo grep '^root:' "$A/etc/shadow"
            exit 1
          fi
          echo "OK: root is passwordless"

          # The image ships no display manager, so a graphical default.target is
          # a target systemd can never complete — the autologin tty never comes
          # to the foreground and the screen looks dead.
          echo "--- default target ---"
          DT=$(sudo readlink "$A/etc/systemd/system/default.target" || echo "(unset)")
          echo "default.target -> $DT"
          case "$DT" in
            *multi-user.target) echo "OK: boots to multi-user (text console)";;
            *) echo "FAIL: default.target is not multi-user; the autologin tty may never foreground"; exit 1;;
          esac

          echo "--- autologin drop-in ---"
          sudo cat "$A/etc/systemd/system/getty@tty1.service.d/autologin.conf"
          # The drop-in must actually force autologin, not just exist.
          sudo grep -q -- '--autologin root' \
            "$A/etc/systemd/system/getty@tty1.service.d/autologin.conf" \
            || { echo "FAIL: tty1 drop-in does not force --autologin root"; exit 1; }
          echo "OK: tty1 autologins root"

          # root's shell must exist inside the image. The account database comes
          # from releng, which points root at zsh; if the edition's package list
          # drops zsh, autologin fails with no visible reason.
          echo "--- root shell ---"
          SHELL_PATH=$(sudo grep '^root:' "$A/etc/passwd" | cut -d: -f7)
          echo "root shell: $SHELL_PATH"
          sudo test -x "$A$SHELL_PATH" \
            || { echo "FAIL: root's shell $SHELL_PATH is not present in the image"; exit 1; }
          echo "OK: root's shell exists"

          echo "--- enabled units ---"
          sudo ls -l "$A/etc/systemd/system/multi-user.target.wants/"
          # -L not -e: these are absolute symlinks into the image, and -e would
          # follow them against the runner's filesystem and always fail.
          sudo test -L "$A/etc/systemd/system/multi-user.target.wants/cameo-firstboot.service" \
            || { echo "FAIL: firstboot not enabled"; exit 1; }

          # The control plane must actually ship and be enabled — the console is
          # the product's front door. Binary staged, both units enabled.
          echo "--- control plane (cameod) ---"
          sudo test -x "$A/usr/local/bin/cameod" \
            || { echo "FAIL: cameod binary missing - the console cannot start"; exit 1; }
          for u in cameod.service cameo-console-init.service; do
            sudo test -L "$A/etc/systemd/system/multi-user.target.wants/$u" \
              || { echo "FAIL: $u not enabled"; exit 1; }
          done
          echo "OK: cameod shipped and enabled"

          # The mission check. Every serve/run/quantize path spawns one of
          # these; without them the image boots and does nothing it exists for.
          echo "--- inference engine ---"
          for b in llama-server llama-cli llama-quantize; do
            sudo test -x "$A/usr/bin/$b" \
              || { echo "FAIL: $b missing - the image cannot serve or run a model"; exit 1; }
            echo "found $b"
          done

          echo "--- pacman mirrors in the live image ---"
          sudo grep -c '^Server' "$A/etc/pacman.d/mirrorlist" \
            || { echo "FAIL: live image has no pacman mirrors"; exit 1; }

          # Resolve each link against the image root rather than the runner's.
          echo "--- dangling unit symlinks ---"
          bad=0
          while IFS= read -r l; do
            t=$(sudo readlink "$l")
            case "$t" in
              /*) r="$A$t" ;;
              *)  r="$(dirname "$l")/$t" ;;
            esac
            if ! sudo test -e "$r"; then
              case "$l" in
                # A dangling link under *.wants is an ENABLED unit systemd will
                # try to start: a real boot failure.
                *.wants/*)
                  echo "DANGLING ENABLED UNIT: $l -> $t"
                  bad=1
                  ;;
                # Anything else is a D-Bus activation alias releng ships for a
                # package Cameo does not include. Nothing ever asks for it, so
                # it is inert clutter rather than a defect.
                *)
                  echo "note: inert alias inherited from releng: $(basename "$l")"
                  ;;
              esac
            fi
          done < <(sudo find "$A/etc/systemd/system" -type l)
          [ "$bad" -eq 0 ] || { echo "FAIL: an enabled unit points at a file not in the image"; exit 1; }
          echo "OK: every enabled unit resolves"

          # releng's /root/.zlogin runs .automated_script.sh, which fetches and
          # executes whatever a `script=` kernel parameter points at, as root,
          # at boot. The airootfs merge inherits it silently, so assert it is
          # gone rather than trusting that the removal stayed in the script.
          echo "--- boot-time remote-execution channel ---"
          for f in root/.zlogin root/.automated_script.sh; do
            if sudo test -e "$A/$f"; then
              echo "FAIL: inherited automation channel /$f is present in the image"
              exit 1
            fi
          done
          echo "OK: no boot-time script= channel"

          # A box meant to be developed on needs an editor and the manuals.
          echo "--- editor and manuals ---"
          for b in vim man; do
            sudo test -x "$A/usr/bin/$b" || { echo "FAIL: $b missing"; exit 1; }
          done
          echo "OK: vim and man present"

      - name: Verify boot splash was rendered
        run: |
          ls -l build/profile/syslinux/splash.png
          file build/profile/syslinux/splash.png
          file build/profile/syslinux/splash.png | grep -q "640 x 480" \
            || { echo "FAIL: splash is not 640x480"; exit 1; }
          echo "OK: Cameo splash rendered at 640x480"

      - name: Verify no dead boot-menu entries
        run: |
          # Each of these selects a kernel or module that is not on the
          # medium, so the entry can only fail when chosen.
          if grep -rniE 'memtest|with speech|accessibility=on' \
               build/profile/syslinux build/profile/efiboot build/profile/grub 2>/dev/null; then
            echo "FAIL: a boot entry points at a payload the image does not ship"
            exit 1
          fi
          echo "OK: no dead boot-menu entries"

      - name: "DIAG log size and tail"
        if: always()
        run: |
          ls -l build.log || echo "NO build.log ON DISK"
          wc -c build.log || true
          echo "--- tail ---"
          tail -n 100 build.log || true

      # Workflow logs need authentication to read. Publishing the captured log
      # to a throwaway branch makes it fetchable over raw.githubusercontent,
      # which is what allows this failure to be diagnosed from outside CI.
      # Fold the account state into the published log. The verify steps above
      # print it too, but their output lands in the workflow log, which needs
      # authentication to read; build.log is fetchable.
      - name: Record account state in the published log
        if: always()
        run: |
          # Report the PROPERTY, never the record. This log is published to a
          # branch that is readable without authentication; the day a root
          # password is set for the installer, exporting the hash here would
          # publish it and nothing would flag it.
          A=$(sudo find build/tmp -maxdepth 3 -type d -name airootfs | head -1)
          {
            echo "=== account state ==="
            if sudo grep -qE '^root::' "$A/etc/shadow" 2>/dev/null; then
              echo "root: passwordless (expected for a live image)"
            elif sudo grep -qE '^root:[!*]' "$A/etc/shadow" 2>/dev/null; then
              echo "root: LOCKED (autologin will fall through to a prompt)"
            else
              echo "root: password hash set (unexpected for a live image)"
            fi
            echo "root shell: $(sudo grep '^root:' "$A/etc/passwd" | cut -d: -f7)"
            echo "=== autologin drop-in ==="
            cat build/profile/airootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf 2>/dev/null || echo "(missing)"
          } >> build.log

      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          rm -rf /tmp/logpub && mkdir -p /tmp/logpub
          cp build.log /tmp/logpub/build.log 2>/dev/null || echo "no build.log produced" > /tmp/logpub/build.log
          cd /tmp/logpub
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.log
          git commit -qm "build log for run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Collect output
        run: |
          sudo chown -R "$(id -u):$(id -g)" archiso/out
          cd archiso/out
          sha256sum ./*.iso > SHA256SUMS
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: cameo-iso-${{ github.event.inputs.edition || 'lite' }}
          path: |
            archiso/out/*.iso
            archiso/out/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
