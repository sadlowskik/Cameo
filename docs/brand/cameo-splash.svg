<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-label="Cameo boot splash">
<title>Cameo boot splash</title>
<!-- Boot background for the syslinux menu. The menu text renders in the upper
     area, so all Cameo art lives in the bottom band (y >= 360) to stay clear. -->
<rect x="0" y="0" width="640" height="480" fill="#171512"/>
<rect x="0" y="0" width="640" height="2" fill="#FF7A1A" opacity="0.5"/>
<rect x="0" y="478" width="640" height="2" fill="#FF7A1A" opacity="0.5"/>

<!-- bottom band divider -->
<line x1="40" y1="366" x2="600" y2="366" stroke="#3A3833" stroke-width="1"/>

<!-- wordmark + tagline, bottom-left -->
<text x="40" y="430" fill="#F6F4F2" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="1">cameo</text>
<text x="44" y="460" fill="#9A958C" font-family="'DejaVu Sans Mono','DejaVu Sans',monospace" font-size="16" letter-spacing="1">any AMD card <tspan fill="#FF7A1A">&#8594;</tspan> a working LLM box</text>

<!-- the mark, bottom-right -->
<g transform="translate(486,372) scale(0.2083)">
  <circle cx="240" cy="240" r="240" fill="#26221D"/>
  <circle cx="240" cy="240" r="232" fill="none" stroke="#454339" stroke-width="15" stroke-dasharray="4 8"/>
  <circle cx="240" cy="240" r="210" fill="#171512"/>
  <g opacity="0.6">
    <circle cx="240" cy="240" r="203" fill="none" stroke="#B4472F" stroke-width="9" stroke-dasharray="2 40"/>
    <circle cx="240" cy="240" r="203" fill="none" stroke="#7C4B3A" stroke-width="9" stroke-dasharray="14 26" opacity="0.45"/>
  </g>
  <g fill="none" stroke-linecap="butt">
    <path d="M 308.8 141.7 A 120 120 0 1 0 308.8 338.3" stroke="#F6F4F2" stroke-width="46"/>
    <path d="M 308.8 141.7 A 120 120 0 0 1 351.3 195.1" stroke="#F6F4F2" stroke-width="46" stroke-dasharray="7 11"/>
    <path d="M 308.8 338.3 A 120 120 0 0 0 351.3 284.9" stroke="#F6F4F2" stroke-width="46" stroke-dasharray="7 11"/>
  </g>
  <circle cx="360" cy="240" r="18" fill="#7A2E12" opacity="0.55"/>
  <circle cx="360" cy="240" r="12" fill="#FF7A1A"/>
  <circle cx="358" cy="237" r="6" fill="#FFD08A"/>
</g>
</svg>
